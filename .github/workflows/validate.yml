name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cloudformation:
    name: CloudFormation lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint --regions us-east-1 us-west-2 -- infrastructure-as-code/cloudformation/*.yaml

  scripts:
    name: Shell scripts and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck
      - name: JSON syntax
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null

  docs:
    name: YAML syntax and Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: YAML syntax (non-CloudFormation)
        run: |
          find . \( -name '*.yaml' -o -name '*.yml' \) -not -path './.git/*' \
            -not -path './infrastructure-as-code/cloudformation/*' -print0 |
            xargs -0 -n1 python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))'
      - name: Markdown links
        run: python3 .github/scripts/check_markdown_links.py
