<text x="740" y="552" font-size="12" font-weight="normal" fill="#232F3E" text-anchor="start" >Symptom: "No tables were found at task initialization."</text>
<text x="740" y="571" font-size="12" font-weight="normal" fill="#232F3E" text-anchor="start" >Cause: table-mapping rules, schema selection, permissions, or connectivity.</text>
<text x="740" y="590" font-size="12" font-weight="normal" fill="#232F3E" text-anchor="start" >Fix: confirm schema &amp; grants, correct mappings, re-run premigration assessment.</text>
