<text x="50" y="552" font-size="12" font-weight="normal" fill="#232F3E" text-anchor="start" >Symptom: MySQL server host name could not be resolved (ODBC connection error).</text>
<text x="50" y="571" font-size="12" font-weight="normal" fill="#232F3E" text-anchor="start" >Cause: DNS / hostname resolution from the replication instance to the source.</text>
<text x="50" y="590" font-size="12" font-weight="normal" fill="#232F3E" text-anchor="start" >Fix: verify DNS, routing, security groups, and port 3306 before creating tasks.</text>
