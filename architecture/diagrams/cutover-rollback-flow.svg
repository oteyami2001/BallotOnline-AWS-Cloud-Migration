<path d="M610,315 L643,315" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#mk)"/>
<path d="M785,315 L818,315" fill="none" stroke="#01A88D" stroke-width="2.5" marker-end="url(#mg)"/>
