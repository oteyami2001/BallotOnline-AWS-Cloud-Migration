<rect x="820" y="175" width="550" height="280" rx="4" fill="#F0FAFA" stroke="#00A4A6" stroke-width="1.5"/>
<text x="830" y="193" font-size="12" font-weight="bold" fill="#007E80" text-anchor="start" >AWS Production</text>
