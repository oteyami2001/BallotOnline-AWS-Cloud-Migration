<text x="870" y="244.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >RDS</text>
<text x="900" y="236" font-size="12" font-weight="bold" fill="#232F3E" text-anchor="start" >Aurora MySQL (cluster endpoint)</text>
<text x="900" y="252" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >writer AZ A · reader AZ B · PITR backups</text>
<rect x="850.0" y="300.0" width="40" height="40" rx="6" fill="#ED7100"/>
<text x="870" y="324.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >EC2</text>
<text x="900" y="316" font-size="12" font-weight="bold" fill="#232F3E" text-anchor="start" >EC2: Intranet · SFTP · NTP</text>
<text x="900" y="332" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >MGN cutover instances, private subnets, SSM</text>
<rect x="850.0" y="380.0" width="40" height="40" rx="6" fill="#8C4FFF"/>
<text x="870" y="404.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >DNS</text>
<text x="900" y="396" font-size="12" font-weight="bold" fill="#232F3E" text-anchor="start" >DNS and application connections switched</text>
<text x="900" y="412" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >low TTLs set at T-7 days</text>
