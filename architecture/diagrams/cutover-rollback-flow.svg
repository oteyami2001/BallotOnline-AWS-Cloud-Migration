<text x="385" y="324.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >MGN</text>
<text x="415" y="316" font-size="12" font-weight="bold" fill="#232F3E" text-anchor="start" >AWS MGN</text>
<text x="415" y="332" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >continuous block replication</text>
