<rect width="1400" height="700" fill="#FFFFFF"/>
<text x="700" y="38" font-size="22" font-weight="bold" fill="#232F3E" text-anchor="middle" >BallotOnline Cutover &amp; Rollback Flow</text>
<text x="700" y="62" font-size="13" font-weight="normal" fill="#545B64" text-anchor="middle" >On-premises → synchronization → go/no-go → AWS production, with a rollback path and post-cutover validation</text>
