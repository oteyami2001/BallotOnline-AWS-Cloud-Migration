<text x="360" y="406" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >validation-queries.sql · test launches</text>
<text x="360" y="422" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >server validation checklist</text>
<polygon points="715,245 785,315 715,385 645,315" fill="#FFF3E6" stroke="#ED7100" stroke-width="2"/>
<text x="715" y="311" font-size="13" font-weight="bold" fill="#B85A00" text-anchor="middle" >GO / NO-GO</text>
