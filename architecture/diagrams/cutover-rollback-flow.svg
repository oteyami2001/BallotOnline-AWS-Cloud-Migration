<text x="715" y="497" font-size="12" font-weight="bold" fill="#B85A00" text-anchor="middle" >NO-GO: stay on source</text>
<text x="715" y="513" font-size="11" font-weight="normal" fill="#545B64" text-anchor="middle" >keep replicating, reschedule</text>
<path d="M870,455 L870,560 L160,560 L160,457" fill="none" stroke="#D13212" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#mr)"/>
<rect x="250" y="538" width="520" height="44" rx="6" fill="#FDF3F1" stroke="#D13212" stroke-width="1.5"/>
<text x="510" y="556" font-size="12" font-weight="bold" fill="#D13212" text-anchor="middle" >ROLLBACK: revert DNS and app connection, start VMs, lift read-only</text>
<text x="510" y="573" font-size="11" font-weight="normal" fill="#545B64" text-anchor="middle" >After users write to Aurora: reverse sync or replay first (decision deadline)</text>
<path d="M1120,455 L1120,598" fill="none" stroke="#E7157B" stroke-width="2" marker-end="url(#mp)"/>
<rect x="900" y="600" width="470" height="88" rx="6" fill="#FDF0F6" stroke="#E7157B" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="915" y="622" font-size="13" font-weight="bold" fill="#B0105E" text-anchor="start" >Post-cutover monitoring &amp; validation (T+1h → T+24h)</text>
<text x="915" y="642" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >Aurora: validation-queries.sql · EC2: server checklist, health-check runbook</text>
<text x="915" y="658" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >CloudWatch alarms + dashboard · SNS · GuardDuty · security checklist</text>
<text x="915" y="674" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >Operational sign-off → finalize MGN, delete DMS, decommission source</text>
