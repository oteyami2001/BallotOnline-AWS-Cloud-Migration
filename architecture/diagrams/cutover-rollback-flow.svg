<text x="75" y="244.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >SQL</text>
<text x="105" y="236" font-size="12" font-weight="bold" fill="#232F3E" text-anchor="start" >MySQL HR database</text>
<text x="105" y="252" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >read-only from T0</text>
<rect x="55.0" y="300.0" width="40" height="40" rx="6" fill="#5A6B7B"/>
<text x="75" y="324.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >HV</text>
<text x="105" y="316" font-size="12" font-weight="bold" fill="#232F3E" text-anchor="start" >Hyper-V VMs</text>
<text x="105" y="332" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >Intranet · FTP · NTP</text>
<text x="50" y="390" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >Kept intact until the</text>
<text x="50" y="406" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >rollback window closes</text>
<text x="50" y="422" font-size="11" font-weight="normal" fill="#545B64" text-anchor="start" >(VMs powered off, DB read-only)</text>
